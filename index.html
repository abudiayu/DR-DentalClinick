<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/faveIcon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dr. Muhammed Zain Dental Clinic</title>
    <!-- Noto Sans Ethiopic (Amharic) + Noto Sans Arabic / Cairo -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Ethiopic:wght@400;600;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Apply saved theme BEFORE React mounts to prevent flash of dark/wrong theme -->
    <script>
      (function () {
        var saved = '';
        try { saved = localStorage.getItem('theme') || ''; } catch (_) {}
        // Default is light — only go dark if explicitly saved
        document.documentElement.setAttribute('data-theme', saved === 'dark' ? 'dark' : 'light');
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
